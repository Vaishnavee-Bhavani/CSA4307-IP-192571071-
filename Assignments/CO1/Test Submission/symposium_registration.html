<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symposium Registration</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: rgba(79, 70, 229, 0.1);
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #6366f1;
      --radius-lg: 20px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-card: 0 20px 45px -15px rgba(15, 23, 42, 0.1), 0 0 1px 1px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 15% 15%, #eef2ff 0%, #f8fafc 40%),
                  radial-gradient(circle at 85% 85%, #f1f5f9 0%, #f8fafc 60%);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    main::before {
      content: "";
      position: absolute;
      top: -15px;
      left: 10%;
      right: 10%;
      height: 100px;
      background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
      filter: blur(48px);
      z-index: -1;
      opacity: 0.6;
    }

    section {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h2 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
      line-height: 1.25;
    }

    /* Success banner styles */
    .status-message {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-weight: 500;
      background-color: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .status-message.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    fieldset {
      border: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    legend {
      width: 100%;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-align: center;
      padding: 0;
    }

    fieldset > div {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #334155;
      letter-spacing: -0.01em;
    }

    input {
      font-family: inherit;
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      background-color: #f8fafc;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:hover {
      border-color: #cbd5e1;
      background-color: #ffffff;
    }

    input:focus {
      border-color: var(--border-focus);
      background-color: #ffffff;
      box-shadow: 0 0 0 4px var(--primary-light);
    }

    button[type="submit"] {
      font-family: inherit;
      width: 100%;
      margin-top: 8px;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button[type="submit"]:hover {
      background: linear-gradient(180deg, #4f46e5 0%, #4338ca 100%);
      box-shadow: 0 6px 16px -2px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px -1px rgba(79, 70, 229, 0.3);
    }

    @media (max-width: 480px) {
      section {
        padding: 32px 24px;
      }

      header h2 {
        font-size: 1.45rem;
      }
    }
  </style>
</head>
<body>

  <main>
    <section>
      <header>
        <h2>Symposium Registration</h2>
      </header>

      <!-- Alert Box -->
      <div id="statusAlert" class="status-message" role="alert" aria-live="polite">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span id="statusText">Registration saved successfully!</span>
      </div>
      
      <form id="regForm" action="/register" method="POST">
        <fieldset>
          <legend>Participant Details</legend>
          
          <div>
            <label for="fullName">Full Name:</label>
            <input 
              type="text" 
              id="fullName" 
              name="name" 
              placeholder="e.g., John Doe" 
              required 
              autocomplete="name">
          </div>
          
          <div>
            <label for="userEmail">Email Address:</label>
            <input 
              type="email" 
              id="userEmail" 
              name="email" 
              placeholder="e.g., john@example.com" 
              required 
              autocomplete="email">
          </div>
          
          <div>
            <button type="submit">Submit Registration</button>
          </div>
        </fieldset>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('regForm');
    const alertBox = document.getElementById('statusAlert');
    const statusText = document.getElementById('statusText');

    form.addEventListener('submit', (e) => {
      // Prevents page reload so the notification stays visible on screen
      e.preventDefault();

      const name = document.getElementById('fullName').value.trim();
      statusText.textContent = `Thanks, ${name || 'participant'}! Your registration has been saved.`;

      alertBox.classList.add('active');
      form.reset();

      // Automatically hides the message after 5 seconds
      setTimeout(() => {
        alertBox.classList.remove('active');
      }, 5000);
    });
  </script>

</body>
</html>
